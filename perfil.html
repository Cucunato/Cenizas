<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <style>
    body {
      background: linear-gradient(to bottom, #8e44ad, #f39c12);
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #9b4d96;
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 1.5rem;
      border-bottom: 2px solid #d1a7d1;
    }

    header a {
      text-decoration: none;
      color: white;
      margin: 0 15px;
      font-weight: bold;
    }

    header a:hover {
      color: #f1c6d1;
    }

    .profile-section {
      padding: 20px;
      max-width: 900px;
      margin: 20px auto;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-header img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #9b4d96;
      margin-bottom: 10px;
    }

    .profile-header h1 {
      font-size: 2rem;
      color: #9b4d96;
      margin: 5px 0;
    }

    .profile-header p {
      font-size: 1.2rem;
      color: #7f8c8d;
    }

    .content-section {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .content-section .media-item {
      background-color: #f9f9f9;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .content-section .media-item img {
      width: 100%;
      border-radius: 8px;
    }

  </style>
</head>
<body>

  <header>
    <a href="index.html">Inicio</a>
    <a href="perfil.html">Perfil</a>
    <a href="mensajes.html">Mensajería</a>
    <a href="subir.html">Subir Publicación</a>
  </header>

  <section class="profile-section">
    <!-- Foto de perfil -->
    <div class="profile-header">
      <img src="https://randomuser.me/api/portraits/men/5.jpg" alt="Foto de perfil" id="profile-img">
      <h1>Nombre de Usuario</h1>
      <p>@usuario123</p>
    </div>

    <!-- Contenido Multimedia -->
    <div class="content-section">
      <div class="media-item">
        <img src="https://via.placeholder.com/400x300" alt="Foto">
        <p>Foto de Perfil</p>
      </div>
      <div class="media-item">
        <video controls>
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
          Tu navegador no soporta el elemento de video.
        </video>
        <p>Video de Usuario</p>
      </div>
    </div>
  </section>

</body>
</html>

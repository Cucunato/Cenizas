<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Publicación</title>
  <style>
    body {
      background: linear-gradient(to bottom, #8e44ad, #f39c12);
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #9b4d96;
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 1.5rem;
      border-bottom: 2px solid #d1a7d1;
    }

    header a {
      text-decoration: none;
      color: white;
      margin: 0 15px;
      font-weight: bold;
    }

    header a:hover {
      color: #f1c6d1;
    }

    .upload-section {
      padding: 20px;
      margin-top: 20px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .upload-section input[type="file"] {
      margin: 20px 0;
    }

  </style>
</head>
<body>

  <header>
    <a href="index.html">Inicio</a>
    <a href="perfil.html">Perfil</a>
    <a href="mensajes.html">Mensajería</a>
    <a href="subir.html">Subir Publicación</a>
  </header>

  <section class="upload-section">
    <h2>Subir Publicación</h2>
    <input type="file" id="upload-photo" accept="image/*">
    <input type="file" id="upload-video" accept="video/*">
    <input type="file" id="upload-music" accept="audio/*">
    <button>Publicar</button>
  </section>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cenizas</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #121212; /* negro oscuro */
      color: #f5f5f5; /* texto claro */
    }

    header {
      background-color: #1e1e1e; /* gris oscuro */
      padding: 1.5rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin: 0;
      color: #e63946;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    nav {
      background-color: #2c2c2c;
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: #f5f5f5;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #e63946;
    }

    .hero {
      background: linear-gradient(rgba(18, 18, 18, 0.7), rgba(18, 18, 18, 0.7)), 
                  url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 6rem 1rem;
      color: #f5f5f5;
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ff6b6b;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: auto;
    }

    footer {
      background-color: #1e1e1e;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cenizas</h1>
  </header>

  <nav>
    <a href="#sobre-mi">Sobre mí</a>
    <a href="#blog">Blog</a>
    <a href="#comunidad">Comunidad</a>
    <a href="#tienda">Tienda</a>
  </nav>

  <section class="hero">
    <h2>Entre lo que arde y lo que queda</h2>
    <p>Un espacio para descubrir, compartir y recordar. Inspirado por el libro "Cenizas".</p>
  </section>

  <footer>
    &copy; 2025 Cenizas. Todos los derechos reservados.
  </footer>
</body>
</html>

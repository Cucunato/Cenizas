<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cenizas</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #fffffb;
      color: #3e3e3e;
    }

    header {
      background-color: #f5ece2;
      padding: 1.5rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin: 0;
      color: #d7b297;
    }

    nav {
      background-color: #ebd9c9;
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: #5b4636;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #d7b297;
    }

    .hero {
      background: linear-gradient(rgba(245, 236, 226, 0.6), rgba(245, 236, 226, 0.6)), url('https://images.unsplash.com/photo-1519337265831-281ec6cc8514?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 6rem 1rem;
      color: #3e3e3e;
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: auto;
    }

    footer {
      background-color: #e1c5b0;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cenizas</h1>
  </header>

  <nav>
    <a href="#sobre-mi">Sobre mí</a>
    <a href="#blog">Blog</a>
    <a href="#comunidad">Comunidad</a>
    <a href="#tienda">Tienda</a>
  </nav>

  <section class="hero">
    <h2>Entre lo que arde y lo que queda</h2>
    <p>Un espacio para descubrir, compartir y recordar. Inspirado por el libro "Cenizas".</p>
  </section>

  <footer>
    &copy; 2025 Cenizas. Todos los derechos reservados.
  </footer>
</body>
</html>

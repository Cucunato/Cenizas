<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Open+Sans&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f8d9e0; /* rosa suave */
      color: #3c3c3c; /* texto oscuro */
    }

    header {
      background-color: #fbc7d4; /* rosa pastel claro */
      padding: 2rem;
      text-align: center;
      border-bottom: 5px solid #f07b8a; /* borde rosa */
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin: 0;
      color: #d0668b; /* rosa más intenso */
    }

    nav {
      background-color: #f07b8a; /* rosa fuerte */
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f8d9e0;
    }

    .content {
      padding: 4rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    .video-card {
      width: 300px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .video-card:hover {
      transform: scale(1.05);
    }

    .video-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .video-card .info {
      padding: 1rem;
      text-align: center;
    }

    .video-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin: 1rem 0;
      color: #f07b8a;
    }

    .video-card .date {
      font-size: 0.9rem;
      color: #888;
    }

    footer {
      background-color: #fbc7d4;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #3c3c3c;
    }

  </style>
</head>

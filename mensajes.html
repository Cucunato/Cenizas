<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajería</title>
  <style>
    /* Estilo para la rueda giratoria */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .loading::after {
      content: '';
      border: 10px solid #f3f3f3;
      border-top: 10px solid #9b4d96;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Estilo para el chat */
    .chat-container {
      display: none;
      padding: 20px;
      height: 80vh;
      overflow-y: auto;
      background-color: #f9f9f9;
    }

    .chat-container p {
      background-color: #f1c6d1;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      max-width: 70%;
    }

    .message-input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

  </style>
</head>
<body>
  <header>
    <a href="index.html">Inicio</a>
    <a href="perfil.html">Perfil</a>
    <a href="mensajes.html">Mensajería</a>
    <a href="subir.html">Subir Publicación</a>
  </header>

  <!-- Rueda giratoria -->
  <div class="loading" id="loading">
    <!-- Rueda del tiempo girando -->
  </div>

  <!-- Chat -->
  <div class="chat-container" id="chat-container">
    <h2>Mensajes</h2>
    <div class="message-box">
      <p>¡Hola! ¿Cómo estás?</p>
      <p>Estoy bien, gracias por preguntar. ¿Y tú?</p>
    </div>
    <textarea class="message-input" placeholder="Escribe tu mensaje..."></textarea>
  </div>

  <script>
    // Simula la carga y muestra el chat después de 3 segundos
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('chat-container').style.display = 'block';
    }, 3000);
  </script>
</body>
</html>
